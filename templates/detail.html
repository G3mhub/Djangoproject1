{% extends "navbar.html" %}

{% block content %}


<h1>{{post.title}}</h1>

<p>{{post.description}}</p>

{% if post.image %}
<img src="{{ post.image.url }}" alt="">
{% else %}
<h3>no tiene ni una imagen manin</h3>
{% endif %}
<a href="{% url 'update' post.pk %}">Edit</a>

<a href="{% url 'delete' post.pk %}">Delete</a>

{% endblock %}
