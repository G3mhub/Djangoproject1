{% load static %}

<link rel="stylesheet" href="{% static 'css/singup.css' %}">

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
</head>
<body>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_username">Nombre de usuario:</label>
            {{ form.username }}  <!-- Campo de nombre de usuario -->
        </div>
        <div class="form-group">
            <label for="id_password1">Contraseña:</label>
            {{ form.password1 }}  <!-- Campo de contraseña -->
        </div>
        <div class="form-group">
            <label for="id_password2">Confirmar contraseña:</label>
            {{ form.password2 }}  <!-- Campo de confirmación de contraseña -->
        </div>
        <button type="submit">Registrarse</button>
    </form>
</body>
</html>
